################################################
# Application
################################################
spring.application.name=api-gateway

################################################
# Server
################################################
server.port=8080

################################################
# Config Server
################################################
spring.config.import=optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:8888

# Retry if Config Server is not yet ready
spring.cloud.config.fail-fast=false
spring.cloud.config.retry.enabled=true
spring.cloud.config.retry.initial-interval=2000
spring.cloud.config.retry.max-attempts=15
spring.cloud.config.retry.max-interval=10000
spring.cloud.config.retry.multiplier=1.5
